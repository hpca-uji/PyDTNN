version: 1
formatters:
  brief:
    format: '%(message)s'
  precise:
    format: '[%(asctime)s] [%(name)s] [%(levelname)s]: %(message)s'
handlers:
  console:
    level: INFO
    class: logging.StreamHandler
    formatter: brief
    stream: ext://sys.stderr
  file:
    level: DEBUG
    class: logging.FileHandler
    formatter: precise
    filename: pydtnn.log
    mode: w
loggers:
  pydtnn:
    level: DEBUG
    handlers: [console, file]
