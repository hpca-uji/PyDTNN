[project]
name = "pydtnn"
version = "3.7.1"
description = "Python Distributed Training of Neural Networks"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Manuel Francisco Dolz Zaragozá", email = "dolzm@uji.es" },
    { name = "Miguel Ángel Prosper Quirós", email = "mprosper@uji.es" },
    { name = "Paul Ximo Pluijter Izquierdo", email = "pluijter@uji.es" },
    { name = "Sergio Barrachina Mir", email = "barrachi@uji.es" },
    { name = "Miguel Pardo Navarro", email = "mipardo@uji.es" },
    { name = "Andrés Enrique Tomás Domínguez", email = "antodo@upv.es" },
    { name = "Adrián Castelló Gimeno", email = "adcastel@uji.es" },
    { name = "Adrián Bartolomé López", email="abartolo@uji.es" },
    { name = "Mar Catalán Carbó", email = "catalama@uji.es" },
    { name = "Jose Ignacio Mestre Miravet", email = "jmiravet@uji.es" },
    { name = "Enrique Salvador Quintana Ortí", email = "quintana@uji.es" }
]
maintainers = [{ name = "Manuel Francisco Dolz Zaragozá", email = "dolzm@uji.es" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
    "Environment :: GPU",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows"
]
keywords = ["Deep neural networks", "Distributed parallel training", "Python"]
urls = { Homepage = "https://github.com/hpca-uji/PyDTNN", Repository = "https://github.com/hpca-uji/PyDTNN.git" }

requires-python = ">=3.13"
dependencies = [
    "cython>=0.29.21",
    "numpy>=1.19.4",
    "prettytable>=2.1.0",
    "rich>=9.9.0",
    "pillow>=12.1.0",
    "scipy>=1.5.4",
    "tqdm>=4.55.0",
    "rapidgzip>=0.15.2",
    "pyyaml>=6.0.3",
    "spacy>=3.8.0"
]

[project.optional-dependencies]
gpu = [
    "pycuda>=2021.1",
    "cupy-cuda12x>=13.6.0"
]
mpi = [
    "mpi4py>=4.1.0",
    "pympi>=1.4.0"
]
fhe = [
    "polyhe>=1.0.0"
]
test = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "torchmetrics>=1.9.0"
]
profile = [
    "memray>=1.19.1"
]
pypi = [
    "build>=1.3.0",
    "auditwheel>=6.5.1",
    "twine>=6.2.0"
]
dev = [
    "autopep8>=2.3.1",
    "flake8>=7.1.1",
    "flake8-docstrings>=1.7.0",
    "mccabe>=0.7.0",
    "pep8-naming>=0.14.1",
    "pipdeptree>=2.23.1",
    "pycodestyle>=2.12.1",
    "pydocstyle>=6.3.0",
    "pyflakes>=3.2.0",
    "absolufy-imports>=0.3.1",
    "isort>=8.0.0"
]

[project.scripts]
pydtnn-benchmark = "pydtnn.cli:main"

[build-system]
requires = [
    "setuptools>=82.0.1",
    "setuptools-scm>=10.0.5",
    "cython>=0.29.21",
    "numpy>=1.19.4"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "pydtnn",
    "pydtnn.*"
]
