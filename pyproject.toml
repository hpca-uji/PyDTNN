[project]
name = "pydtnn"
version = "3.9.1"
description = "Python Distributed Training of Neural Networks"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Manuel Francisco Dolz Zaragozá", email = "dolzm@uji.es" },
    { name = "Miguel Ángel Prosper Quirós", email = "mprosper@uji.es" },
    { name = "Paul Ximo Pluijter Izquierdo", email = "pluijter@uji.es" },
    { name = "Sergio Barrachina Mir", email = "barrachi@uji.es" },
    { name = "Miguel Pardo Navarro", email = "mipardo@uji.es" },
    { name = "Andrés Enrique Tomás Domínguez", email = "antodo@upv.es" },
    { name = "Adrián Castelló Gimeno", email = "adcastel@uji.es" },
    { name = "Adrián Bartolomé López", email="abartolo@uji.es" },
    { name = "Mar Catalán Carbó", email = "catalama@uji.es" },
    { name = "Jose Ignacio Mestre Miravet", email = "jmiravet@uji.es" },
    { name = "Enrique Salvador Quintana Ortí", email = "quintana@uji.es" }
]
maintainers = [{ name = "Manuel Francisco Dolz Zaragozá", email = "dolzm@uji.es" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
    "Environment :: GPU",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows"
]
keywords = ["Deep neural networks", "Distributed parallel training", "Python"]
urls = { Homepage = "https://github.com/hpca-uji/PyDTNN", Repository = "https://github.com/hpca-uji/PyDTNN.git" }

requires-python = "~=3.13"
dependencies = [
    "cython~=3.2",
    "numpy~=2.4",
    "prettytable~=3.17",
    "rich~=15.0",
    "pillow~=12.2",
    "scipy~=1.17",
    "tqdm~=4.67",
    "rapidgzip~=0.16",
    "pyyaml~=6.0",
    "spacy~=3.8"
]

[project.optional-dependencies]
mpi = [
    "mpi4py~=4.1",
    "pympi~=1.4"
]
gpu = [
    "pycuda~=2026.1",
    "cupy-cuda12x~=14.0"
]
fhe = [
    "polyhe~=1.0"
]
format = [
    "autopep8~=2.3",
    "absolufy-imports~=0.3",
    "isort~=8.0",
    "ruff~=0.15"
]
test = [
    "torch~=2.11",
    "torchvision~=0.26",
    "torchmetrics~=1.9",
    "pytest~=9.0",
    "pytest-xdist~=3.8",
    "pytest-cov~=7.1"
]
lint = [
    "flake8~=7.3",
    "flake8-gl-codeclimate~=0.2",
    "flake8-docstrings~=1.7",
    "flake8-annotations~=3.2",
    "flake8-pyproject~=1.2",
    "mccabe~=0.7",
    "pep8-naming~=0.15",
    "pycodestyle~=2.14",
    "pydocstyle~=6.3",
    "pyflakes~=3.4",
    "radon~=6.0",
    "pyright~=1.1"
]
profile = [
    "memray~=1.19"
]
build = [
    "build~=1.4",
    "auditwheel~=6.6",
    "twine~=6.2"
]
dev = [
    "pydtnn[profile]",
    "pydtnn[format]",
    "pydtnn[test]",
    "pydtnn[lint]",
    "pydtnn[build]"
]

[project.scripts]
pydtnn-benchmark = "pydtnn.__main__:_start"

[build-system]
requires = [
    "setuptools~=82.0",
    "setuptools-scm~=10.0",
    "cython~=3.2",
    "numpy~=2.4",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "pydtnn",
    "pydtnn.*"
]

[tool.flake8]
max-line-length = 128
max-complexity = 16
allow-untyped-nested = true
respect-type-ignore = true
ignore = [
    "D202",
    "D400",
    "D401",
    "W503",
    "ANN101",
    "ANN102",
    "ANN401"
]
exclude = [
    ".venv",
    "build",
    "vendor"
]
per-file-ignores = [
    "pydtnn/converters/*:N802",
    "pydtnn/converters/onnx2pydtnn/*:N802,N806",
    "pydtnn/libs/*:N801,N802,N803,N816,N818,E501,M100"
]

[project.entry-points."flake8.extension"]
M = "pydtnn.utils.flake8_metrics:MetricsChecker"
T = "pydtnn.utils.flake8_pyright:PyrightChecker"

[tool.pyright]
venv = ".venv"
venvPath = "."
include = ["pydtnn", "scripts"]
exclude = [".venv", "**/.*", "**/__pycache__", "build", "vendor"]
typeCheckingMode = "standard"
enableReachabilityAnalysis = true

# project
deprecateTypingAliases = true
enableTypeIgnoreComments = false
reportDuplicateImport = "error"
reportTypeCommentUsage = "error"
reportUnusedImport = "error"
reportWildcardImportFromLibrary = "error"

# typing
reportInvalidStubStatement = "information"
reportUnnecessaryTypeIgnoreComment = "information"
reportIncompleteStub = "warning"
reportInvalidTypeForm = "warning"
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
reportMissingParameterType = "warning"
reportMissingTypeArgument = "warning"
reportMissingTypeStubs = "warning"
reportReturnType = "warning"
reportUntypedBaseClass = "warning"
reportUntypedClassDecorator = "warning"
reportUntypedFunctionDecorator = "warning"
reportUntypedNamedTuple = "warning"
reportInvalidTypeVarUse = "error"

# python
reportUnusedClass = "information"
reportUnusedCoroutine = "information"
reportUnusedExcept = "information"
reportUnusedExpression = "information"
reportUnusedFunction = "information"
reportUnusedVariable = "information"
reportConstantRedefinition = "warning"
reportDeprecated = "warning"
reportImportCycles = "warning"
reportIncompatibleMethodOverride = "warning"
reportIncompatibleVariableOverride = "warning"
reportInconsistentConstructor = "warning"
reportMatchNotExhaustive = "warning"
reportMissingSuperCall = "warning"
reportPrivateImportUsage = "warning"
reportPrivateUsage = "warning"
reportPropertyTypeMismatch = "warning"
reportAssertAlwaysTrue = "error"
reportInvalidStringEscapeSequence = "error"
reportSelfClsParameterName = "error"

[tool.autopep8]
max-line-length = 100
ignore = [
    "E501"
]

[tool.coverage.run]
branch = true
source_pkgs = [
    "pydtnn"
]

[tool.coverage.report]
include = [
    "*/pydtnn/*"
]
omit = [
    "*/pydtnn/converters/*",
    "*/pydtnn/datasets/*",
    "*/pydtnn/libs/*",
    "*/pydtnn/models/*",
    "*/pydtnn/tests/*",
    "*/pydtnn/tracers/*",
    "*/pydtnn/utils/*"
]