stages:
- build
- release

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

job_build:
  stage: build

  tags: [ lorca-ubuntu ]
  image: python:latest

  before_script:
  - apt-get update
  - apt-get install -y gcc patchelf
  - pip install build twine auditwheel
  script:
  - python -m build --outdir ./build/ --sdist
  - python -m build --outdir ./build/wheel/ --wheel
  - python -m auditwheel repair --wheel-dir ./build/ ./build/wheel/*.whl

  artifacts:
    paths:
      - ./build/pydtnn-*

job_release:
  stage: release

  tags: [ lorca-ubuntu ]
  image: registry.gitlab.com/gitlab-org/cli:latest

  needs:
  - job: job_build
    artifacts: true

  script:
  - glab auth login --hostname lorca.act.uji.es/gitlab --token "$GLAB_TOKEN"
  - glab release create "ci-$CI_COMMIT_SHA" ./build/pydtnn-* --ref "$CI_COMMIT_SHA"