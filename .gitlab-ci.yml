stages:
- build
- merge
- push

variables:
  BRANCH_MAIN: main
  BRANCH_WORK: develop
  GIT_DEPTH: 3
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: recursive

job_build:
  stage: build

  variables:
    PYTHON_VERSION: latest
    PIP_ROOT_USER_ACTION: ignore
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/build/pip"

  rules:
  - if: '$CI_COMMIT_BRANCH == $BRANCH_WORK'

  tags: [ lorca-ubuntu ]
  image: python:$PYTHON_VERSION

  cache:
  - key:
      files:
      - Makefile
      - pyproject.toml
    paths:
    - build
    when: always

  before_script:
  - apt-get update
  - mkdir -p ./build
  - export $(make env | xargs)
  - make vendor-deps APT="apt-get -o dir::cache::archives=$PWD/build/apt"
  - make pydtnn-deps APT="apt-get -o dir::cache::archives=$PWD/build/apt"
  - make vendor-install PROCS=1 &> ./build/make.log
  script:
  - make pydtnn-clean
  - make pydtnn-build PROCS=1
  - WHEEL=$(echo ./build/pydtnn/*.whl)
  - pip install ${WHEEL:?}[build,test,quality]
  - TAG=v$(python -c "from importlib.metadata import version; print(version('pydtnn'))")
  - printf '%s\n' GIT_TAG=${TAG:?} PUBLIC_TAG=$(git tag | grep -xF ${TAG:?}) > ./build/gitlab-ci.env
  - make pydtnn-check PROCS=1

  artifacts:
    reports:
      dotenv: ./build/gitlab-ci.env
      junit: ./build/pydtnn-check/tests.xml
      coverage_report:
        coverage_format: cobertura
        path: ./build/pydtnn-check/coverage.xml
      codequality: ./build/pydtnn-check/quality.json
    paths:
    - ./build/pydtnn/pydtnn-*
    - ./build/make.log
    expire_in: 1d
    when: always
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

