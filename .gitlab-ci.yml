stages:
  - build
#  - release

variables:
  CIBW_SKIP: "*musllinux* cp*t-*"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

job_build:
  stage: build

  tags: [ lorca-ubuntu ]
  image: python:3.13

  before_script:
    - apt-get update
    - apt-get install -y glab docker.io
    - pip install build cibuildwheel
  script:
    - python -m build --sdist --outdir ./build/
    - python -m cibuildwheel --output-dir ./build/
    - glab auth login --hostname lorca.act.uji.es --token "$GLAB_TOKEN"
    - glab config set api_host https://lorca.act.uji.es/gitlab/api/v4 --host lorca.act.uji.es
    - glab release create "ci-$CI_COMMIT_SHA" build/* --ref "$CI_COMMIT_SHA" --repo "$CI_PROJECT_PATH"

