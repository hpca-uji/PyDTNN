  tags: [ lorca-ubuntu ]
  image: registry.gitlab.com/gitlab-org/cli:latest

  needs:
  - job: job_build
    artifacts: true
  - job: job_test
    artifacts: true

  script:
  - glab auth login --hostname lorca.act.uji.es/gitlab --token "${CI_JOB_TOKEN:?}"
  - |
    # LINKS=""
