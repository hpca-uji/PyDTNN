stages:
- build
- check
- merge
- push

variables:
  BRANCH_MAIN: main
  BRANCH_WORK: develop
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
- key:
    files:
    - pyproject.toml
  paths:
  - .cache/pip
  when: always

job_build:
  stage: build

  rules:
  - if: '$CI_COMMIT_BRANCH == $BRANCH_WORK'

  tags: [ lorca-ubuntu ]
  image: python:latest

  before_script:
  - apt-get update
  - apt-get install -y gcc patchelf
  - pip install build twine auditwheel
  script:
  - python -m build --outdir ./build/ --sdist
  - python -m build --outdir ./build/wheel/ --wheel
  - python -m auditwheel repair --wheel-dir ./build/ ./build/wheel/*.whl

  artifacts:
    expire_in: 1d
    paths:
    - ./build/pydtnn-*

job_check:
  stage: check

  rules:
  - if: '$CI_COMMIT_BRANCH == $BRANCH_WORK'

  tags: [ lorca-ubuntu ]
  image: python:latest

  needs:
    - job: job_build
      artifacts: true

  before_script:
  - WHEEL=$(echo ./build/*.whl) && pip install ${WHEEL:?}[test]
  script:
  - TAG=v$(python -c "from importlib.metadata import version; print(version('pydtnn'))")
  - printf '%s\n' GIT_TAG=${TAG:?} PUBLIC_TAG=$(git tag | grep -xF ${TAG:?}) > ./build/env
  - pytest -v -n 1 --dist loadscope --junitxml=./build/tests --pyargs pydtnn.tests.groups.all

  artifacts:
    when: always
    reports:
      dotenv: ./build/env
      junit: ./build/tests

