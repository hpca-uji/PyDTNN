stages:
- make
- merge
- push

variables:
  BRANCH_MAIN: main
  BRANCH_WORK: develop
  GIT_SUBMODULE_STRATEGY: none

job_make:
  stage: make

  variables:
    PYTHON_VERSION: latest
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/build/pip"

  rules:
  - if: '$CI_COMMIT_BRANCH == $BRANCH_WORK'

  tags: [ lorca-ubuntu ]
  image: python:$PYTHON_VERSION

  # cache:
  # - key:
  #     files:
  #     - Makefile
  #     - pyproject.toml
  #   paths:
  #   - build
  #   - /var/cache/apt/archives
  #   when: always

  script:
  - ls -al vendor/*
  - apt-get update
  - apt-get install -y time
  - make vendor-clean pydtnn-clean
  - export $(make env | xargs)
  - make tvm-deps
  - make tvm-src
  - /usr/bin/time -v make tvm-build PROCS=1 || true
  - ls -d vendor/
  - ls -d vendor/tvm/
  - ls -d vendor/tvm/3rdparty/
  - ls -d vendor/tvm/3rdparty/tvm-ffi/
  - ls -d vendor/tvm/3rdparty/tvm-ffi/3rdparty/
  - ls -d vendor/tvm/3rdparty/tvm-ffi/3rdparty/dlpack/
  - ls -d vendor/tvm/3rdparty/tvm-ffi/3rdparty/dlpack/include/
  - ls -d vendor/tvm/3rdparty/tvm-ffi/3rdparty/dlpack/include/dlpack/
  - ls -d vendor/tvm/3rdparty/tvm-ffi/3rdparty/dlpack/include/dlpack/dlpack.h
