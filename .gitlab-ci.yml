stages:
- build
- merge
- push

variables:
  GIT_DEPTH: 0
  BRANCH_MAIN: master
  BRANCH_WORK: develop
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive

job_build:
  stage: build

  variables:
    PYTHON_VERSION: latest
    PIP_ROOT_USER_ACTION: ignore
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/build/pip"

  rules:
  - if: '$CI_COMMIT_BRANCH == $BRANCH_WORK'

  tags: [ lorca-ubuntu ]
  image: python:$PYTHON_VERSION

  cache:
  - paths:
    - build
    when: always

  before_script:
  - make sync
  - apt-get update
  - mkdir -p ./build
  - export $(make env | xargs)
  - make deps APT="apt-get -o dir::cache::archives=$PWD/build/apt"
  script:
  - make build NPROC=1
  - make install PYDTNN_PKG=build,test,lint
  - TAG=v$(python -c "from importlib.metadata import version; print(version('pydtnn'))")
  - printf '%s\n' GIT_TAG=${TAG:?} PUBLIC_TAG=$(git tag | grep -xF ${TAG:?}) > ./build/gitlab.env
  - make test NPROC=1
  - make lint NPROC=1

  artifacts:
    reports:
      dotenv: ./build/gitlab.env
      junit: ./build/pydtnn/tests.xml
      coverage_report:
        coverage_format: cobertura
        path: ./build/pydtnn/coverage.xml
      codequality: ./build/pydtnn/quality.json
    paths:
    - ./build/pydtnn/pydtnn-*
    expire_in: 1d
    when: always
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

job_merge:
  stage: merge

  rules:
  - if: '$CI_COMMIT_BRANCH == $BRANCH_WORK'

  image: registry.gitlab.com/gitlab-org/cli:latest
  tags: [ lorca-ubuntu ]

  needs:
  - job: job_build

  rules:
  - if: '$CI_COMMIT_BRANCH == $BRANCH_WORK'

  resource_group: $BRANCH_MAIN

  before_script:
  - glab auth login --hostname lorca.act.uji.es/gitlab --token "${CI_JOB_TOKEN:?}"
  - git config --global user.email "ci@lorca.act.uji.es"
  - git config --global user.name "GitLab CI"
  script:
  - GIT_REMOTE=$(git remote)
  - git fetch ${GIT_REMOTE:?} ${BRANCH_MAIN:?}
  - git checkout -B ${BRANCH_MAIN:?} ${GIT_REMOTE:?}/${BRANCH_MAIN:?}
  - git merge ${CI_COMMIT_SHA:?} --ff-only
  - git push ${GIT_REMOTE:?} ${BRANCH_MAIN:?}
  - git checkout ${CI_COMMIT_SHA:?}

job_push:
  stage: push

  rules:
  - if: '$CI_COMMIT_BRANCH == $BRANCH_WORK && $PUBLIC_TAG == ""'

  tags: [ lorca-ubuntu ]
  image: registry.gitlab.com/gitlab-org/cli:latest

  needs:
  - job: job_build
    artifacts: true
  - job: job_merge

  before_script:
  - glab auth login --hostname lorca.act.uji.es/gitlab --token "${CI_JOB_TOKEN:?}"
  script:
  - glab release delete "${GIT_TAG:?}" --yes || true
  - glab release create "${GIT_TAG:?}" ./build/pydtnn/pydtnn-* --ref "${CI_COMMIT_SHA:?}" --name "PyDTNN ${GIT_TAG:?}"
