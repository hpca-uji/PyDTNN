stages:
  - build
#  - release

variables:
  CIBW_SKIP: "*musllinux* cp*t-*"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

job_build:
  stage: build

  tags: [ lorca-ubuntu ]
  image: python:latest

  before_script:
    - apt-get update
    - apt-get install -y glab docker.io
    - pip install build cibuildwheel
  script:
    - python -m build --sdist --outdir ./build/
    - python -m cibuildwheel --output-dir ./build/
    - |
      TAG="ci-$CI_COMMIT_SHA"

      # Crear release
      curl --fail \
          --header "PRIVATE-TOKEN: $GLAB_TOKEN" \
          --request POST \
          --data "name=$TAG" \
          --data "tag_name=$TAG" \
          --data "ref=$CI_COMMIT_SHA" \
          "https://lorca.act.uji.es/gitlab/api/v4/projects/$CI_PROJECT_ID/releases"

      # Subir wheels y añadirlos a la release
      for file in build/*.whl; do
        echo "Uploading $file"

        RESPONSE=$(curl --silent --fail \
            --header "PRIVATE-TOKEN: $GLAB_TOKEN" \
            --form "file=@$file" \
            "https://lorca.act.uji.es/gitlab/api/v4/projects/$CI_PROJECT_ID/uploads")

        URL=$(echo "$RESPONSE" | jq -r '.url')

        echo "Creating asset link for $file"

        curl --fail \
            --header "PRIVATE-TOKEN: $GLAB_TOKEN" \
            --request POST \
            --data-urlencode "name=$(basename "$file")" \
            --data-urlencode "url=https://lorca.act.uji.es/gitlab${URL}" \
            "https://lorca.act.uji.es/gitlab/api/v4/projects/$CI_PROJECT_ID/releases/$TAG/assets/links"
      done

