stages:
  - build
#  - release

variables:
  CIBW_SKIP: "*musllinux* cp*t-*"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

job_build:
  stage: build

  tags: [ lorca-ubuntu ]
  image: python:latest

  before_script:
    - apt-get update
    - apt-get install -y glab docker.io
    - pip install build cibuildwheel
  script:
    - python -m build --sdist --outdir ./build/
    - python -m cibuildwheel --output-dir ./build/
    -|
      TAG="ci-$CI_COMMIT_SHA"

      curl --header "PRIVATE-TOKEN: $GLAB_TOKEN" \
           --request POST \
           --data "name=$TAG" \
           --data "tag_name=$TAG" \
           --data "ref=$CI_COMMIT_SHA" \
           "https://lorca.act.uji.es/gitlab/api/v4/projects/$CI_PROJECT_ID/releases"

      for file in build/*; do
        curl --header "PRIVATE-TOKEN: $GLAB_TOKEN" \
             --upload-file "$file" \
             "https://lorca.act.uji.es/gitlab/api/v4/projects/$CI_PROJECT_ID/packages/generic/wheels/$TAG/$(basename "$file")"
      done

