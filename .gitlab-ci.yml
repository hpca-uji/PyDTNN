stages:
- build
- test
- merge
- release

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

job_build:
  stage: build

  rules:
  - if: '$CI_COMMIT_BRANCH == "develop"'

  tags: [ lorca-ubuntu ]
  image: python:latest

  before_script:
  - apt-get update
  - apt-get install -y gcc patchelf
  - pip install build twine auditwheel
  script:
  - python -m build --outdir ./build/ --sdist
  - python -m build --outdir ./build/wheel/ --wheel
  - python -m auditwheel repair --wheel-dir ./build/ ./build/wheel/*.whl

  artifacts:
    expire_in: 30min
    paths:
    - ./build/pydtnn-*

job_test:
  stage: test

  rules:
  - if: '$CI_COMMIT_BRANCH == "develop"'

  tags: [ lorca-ubuntu ]
  image: python:latest

  needs:
    - job: job_build
      artifacts: true

  before_script:
    - pip install pytest ./build/*.whl
    - python -c "from importlib.metadata import version; print('PYDTNN_VERSION', version('pydtnn'), sep='=')" > ./build/env
  script:
    - pytest --junitxml=./build/tests --pyargs pydtnn.tests.groups.all

  artifacts:
    when: always
    reports:
      dotenv: ./build/env
      junit: ./build/tests

