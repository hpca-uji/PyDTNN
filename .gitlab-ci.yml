stages:
- build
- merge
- push

variables:
  BRANCH_MAIN: master
  BRANCH_WORK: develop
  GIT_DEPTH: 0
  GIT_STRATEGY: none
  GIT_SUBMODULE_STRATEGY: none

job_build:
  stage: build

  variables:
    GIT_STRATEGY: fetch
    GIT_SUBMODULE_STRATEGY: recursive
    PIP_ROOT_USER_ACTION: ignore
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/build/pip"

  rules:
  - if: '$CI_COMMIT_BRANCH == $BRANCH_WORK'

  tags: [ lorca-ubuntu ]
  image: python:latest

  cache:
  - paths:
    - build
    when: always

  before_script:
  - make sync
  - apt-get update
  - mkdir -p ./build
  - export $(make env | xargs)
  - make deps APT="apt-get -o dir::cache::archives=${PWD:?}/build/apt"
  script:
  - make pydtnn-clean
  - make build NPROC=1
  - make install PYDTNN_PKG=test,lint
  - make test NPROC=1
  - make lint NPROC=1

  artifacts:
    reports:
      junit: ./build/pydtnn/tests.xml
      coverage_report:
        coverage_format: cobertura
        path: ./build/pydtnn/coverage.xml
      codequality: ./build/pydtnn/quality.json
    paths:
    - ./build/pydtnn/pydtnn-*
    expire_in: 1d
    when: always
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

job_merge:
  stage: merge

  variables:
    GIT_STRATEGY: fetch

  rules:
  - if: '$CI_COMMIT_BRANCH == $BRANCH_WORK'

  image: registry.gitlab.com/gitlab-org/cli:latest
  tags: [ lorca-ubuntu ]

  needs:
  - job: job_build
    artifacts: true

  rules:
  - if: '$CI_COMMIT_BRANCH == $BRANCH_WORK'

  resource_group: $BRANCH_MAIN

  before_script:
  - GIT_REMOTE_NAME=$(git remote)
  - GIT_REMOTE_URL=$(git remote get-url "${GIT_REMOTE_NAME:?}")
  - GIT_TAG=$(basename ./build/pydtnn/pydtnn-*.tar.gz | sed -nE 's|^pydtnn-(.*)\.tar\.gz$|v\1|p')
  - git remote set-url "${GIT_REMOTE_NAME}" "${GIT_REMOTE_URL/gitlab-ci-token:[^@]*@/gitlab-ci-token:${CI_JOB_TOKEN:?}@}"
  - glab auth login --hostname "${CI_SERVER_FQDN:?}" --token "${CI_JOB_TOKEN:?}"
  script:
  - git fetch "${GIT_REMOTE_NAME:?}" "${BRANCH_MAIN:?}"
  - git checkout -B "${BRANCH_MAIN:?}" "${GIT_REMOTE_NAME:?}/${BRANCH_MAIN:?}"
  - git merge "${CI_COMMIT_SHA:?}" --ff-only
  - git tag "${GIT_TAG:?}" "${CI_COMMIT_SHA:?}" || true
  - git push "${GIT_REMOTE_NAME:?}" "${BRANCH_MAIN:?}" "${GIT_TAG:?}"

job_push:
  stage: push

  rules:
  - if: '$CI_COMMIT_BRANCH == $BRANCH_WORK'

  tags: [ lorca-ubuntu ]
  image: registry.gitlab.com/gitlab-org/cli:latest

  needs:
  - job: job_build
    artifacts: true
  - job: job_merge

  before_script:
  - GIT_TAG=$(basename ./build/pydtnn/pydtnn-*.tar.gz | sed -nE 's|^pydtnn-(.*)\.tar\.gz$|v\1|p')
  - glab auth login --hostname "${CI_SERVER_FQDN:?}" --token "${CI_JOB_TOKEN:?}"
  script:
  - glab release delete "${GIT_TAG:?}" --yes || true
  - glab release create "${GIT_TAG:?}" ./build/pydtnn/pydtnn-* --ref "${CI_COMMIT_SHA:?}" --name "${CI_PROJECT_TITLE:?} ${GIT_TAG:?}"
