stages:
- build
- check
- merge
- push

variables:
  BRANCH_MAIN: main
  BRANCH_WORK: develop
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
- key:
    files:
    - pyproject.toml
  paths:
  - .cache/pip
  when: always
- key:
    files:
    - Makefile
  paths:
  - build
  # - vendor
  - /var/cache/apt/archives
  when: always

job_build:
  stage: build

  rules:
  - if: '$CI_COMMIT_BRANCH == $BRANCH_WORK'

  tags: [ lorca-ubuntu ]
  image: python:latest

  before_script:
  - apt-get update
  - export $(make env | tee ./build/env | xargs)
  - make pydtnn-deps
  script:
  - make pydtnn-clean
  - make pydtnn-build

  artifacts:
    expire_in: 1d
    reports:
      dotenv: ./build/env
    paths:
    - ./build/pydtnn/

job_check:
  stage: check

  rules:
  - if: '$CI_COMMIT_BRANCH == $BRANCH_WORK'

  tags: [ lorca-ubuntu ]
  image: python:latest

  needs:
    - job: job_build
      artifacts: true

  before_script:
  - WHEEL=$(echo ./build/pydtnn/*.whl) && pip install ${WHEEL:?}[test]
  script:
  - TAG=v$(python -c "from importlib.metadata import version; print(version('pydtnn'))")
  - printf '%s\n' GIT_TAG=${TAG:?} PUBLIC_TAG=$(git tag | grep -xF ${TAG:?}) >> ./build/env
  - make pydtnn-test PROCS=1

  artifacts:
    reports:
      dotenv: ./build/env
      junit: ./build/tests
      coverage_report:
        coverage_format: cobertura
        path: ./build/coverage
    when: always

